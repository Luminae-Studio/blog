<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>O Som dos Livros</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Magali Ayelen">
<link rel="shortcut icon" href="/blog/imagens/favicon.PNG">

<style>
  body {
    margin: 0;
    background: url("/blog/imagens/fundo-index.jpg") no-repeat center center fixed;
    background-size: cover;
    font-family: 'Georgia', serif;
  }

  main {
    position: relative;
    min-height: 100vh;
  }

  .portal {
    position: absolute;
    cursor: pointer;
    transition: transform 0.4s ease, filter 0.4s ease;
  }

  .portal img {
    max-width: 260px;
    display: block;
  }

  .portal:hover {
    transform: translateY(-6px) scale(1.03);
    filter: drop-shadow(0 10px 20px rgba(40, 20, 80, 0.5));
  }

  .alma       { top: 8%;  left: 20%; }
  .centro     { top: 25%; left: 40%; }
  .manchita   { top: 55%; right: 20%; }
  .em-disputa { top: 8%;  right: 20%; }

  .portal-label {
    display: block;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 1rem;
    font-style: italic;
    color: #ede0f5;
    text-shadow:
      0 1px 6px rgba(40, 10, 70, 0.7),
      0 0 2px rgba(40, 10, 70, 0.5);
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  /* ===== FOOTER ===== */
  footer {
    width: 100%;
  }

  .footer-divider-img img {
    width: 100%;
    display: block;
  }

  .footer-cloud {
    min-height: 64px;
    background-color: #b99fbb;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px 20px;
  }

  .footer-socials {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }

  /* ===== BOTÕES SOCIAIS ===== */
  .social-btn {
    all: unset;
    cursor: pointer;
    position: relative;
    border-radius: 100em;
    background-color: rgba(60, 20, 80, 0.75);
    box-shadow:
      -0.15em -0.15em 0.15em -0.075em rgba(5, 5, 5, 0.25),
      0.0375em 0.0375em 0.0675em 0 rgba(5, 5, 5, 0.1);
    text-decoration: none;
    display: inline-block;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }

  .social-btn::after {
    content: "";
    position: absolute;
    z-index: 0;
    width: calc(100% + 0.3em);
    height: calc(100% + 0.3em);
    top: -0.15em;
    left: -0.15em;
    border-radius: inherit;
    background: linear-gradient(
      -135deg,
      rgba(5, 5, 5, 0.5),
      transparent 20%,
      transparent 100%
    );
    filter: blur(0.0125em);
    opacity: 0.25;
    mix-blend-mode: multiply;
  }

  .btn-outer {
    position: relative;
    z-index: 1;
    border-radius: inherit;
    transition: box-shadow 300ms ease;
    will-change: box-shadow;
    box-shadow:
      0 0.05em 0.05em -0.01em rgba(5, 5, 5, 1),
      0 0.01em 0.01em -0.01em rgba(5, 5, 5, 0.5),
      0.15em 0.3em 0.1em -0.01em rgba(5, 5, 5, 0.25);
  }

  .social-btn:hover .btn-outer {
    box-shadow:
      0 0 0 0 rgba(5, 5, 5, 1),
      0 0 0 0 rgba(5, 5, 5, 0.5),
      0 0 0 0 rgba(5, 5, 5, 0.25);
  }

  .btn-inner {
    position: relative;
    z-index: 1;
    border-radius: inherit;
    padding: 0.45em 1em;
    display: flex;
    align-items: center;
    gap: 6px;
    background-image: linear-gradient(
      135deg,
      rgba(210, 185, 230, 1),
      rgba(175, 140, 200, 1)
    );
    transition:
      box-shadow 300ms ease,
      clip-path 250ms ease,
      transform 250ms ease;
    will-change: box-shadow, clip-path, transform;
    overflow: clip;
    clip-path: inset(0 0 0 0 round 100em);
    box-shadow:
      0 0 0 0 inset rgba(5, 5, 5, 0.1),
      -0.05em -0.05em 0.05em 0 inset rgba(5, 5, 5, 0.25),
      0 0 0.05em 0.2em inset rgba(255, 255, 255, 0.25),
      0.025em 0.05em 0.1em 0 inset rgba(255, 255, 255, 1),
      0.12em 0.12em 0.12em inset rgba(255, 255, 255, 0.25),
      -0.075em -0.25em 0.25em 0.1em inset rgba(5, 5, 5, 0.25);
  }

  .social-btn:hover .btn-inner {
    clip-path: inset(
      clamp(1px, 0.0625em, 2px) clamp(1px, 0.0625em, 2px)
      clamp(1px, 0.0625em, 2px) clamp(1px, 0.0625em, 2px) round 100em
    );
    box-shadow:
      0.1em 0.15em 0.05em 0 inset rgba(5, 5, 5, 0.75),
      -0.025em -0.03em 0.05em 0.025em inset rgba(5, 5, 5, 0.5),
      0.25em 0.25em 0.2em 0 inset rgba(5, 5, 5, 0.5),
      0 0 0.05em 0.5em inset rgba(255, 255, 255, 0.15),
      0 0 0 0 inset rgba(255, 255, 255, 1),
      0.12em 0.12em 0.12em inset rgba(255, 255, 255, 0.25),
      -0.075em -0.12em 0.2em 0.1em inset rgba(5, 5, 5, 0.25);
  }

  .social-btn:active .btn-inner {
    transform: scale(0.975);
  }

  .btn-inner svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    color: #2e1040;
    position: relative;
    z-index: 4;
  }

  .btn-inner span {
    position: relative;
    z-index: 4;
    font-family: 'Georgia', serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(0, 0, 0, 0);
    background-image: linear-gradient(
      135deg,
      rgba(46, 16, 64, 1),
      rgba(90, 40, 110, 1)
    );
    -webkit-background-clip: text;
    background-clip: text;
    transition: transform 250ms ease;
    display: block;
    will-change: transform;
    user-select: none;
  }

  .social-btn:hover .btn-inner span {
    transform: scale(0.975);
  }

  /* ===== MOBILE ===== */
  @media (max-width: 800px) {
    main {
      min-height: auto;
    }

    .portal {
      position: static;
      display: block;
      margin: 20px auto;
      text-align: center;
    }

    .portal img {
      max-width: 180px;
      margin: 0 auto;
    }

    .footer-socials {
      gap: 8px;
    }
  }
</style>
</head>

<body>

<main>

  <a href="alma.html" class="portal alma">
    <img src="https://64.media.tumblr.com/e97ee359f3a8b78558964b5e96321508/6772bffe8d08fe8d-cb/s2048x3072/076a77f7dcc0c2049306011266af543b182c6c61.gifv">
  </a>

  <a class="portal centro">
    <img src="https://64.media.tumblr.com/28d9847370da54c4689e3f01c521939a/44e28fec3bca1733-b4/s2048x3072/7860d550ab898931cae29983c6e4a5937a786889.gifv">
  </a>

  <a href="manchita.html" class="portal manchita">
    <img src="https://64.media.tumblr.com/3baa4cb7e358e65043e0cbb1d92098f3/4229592f50130873-60/s2048x3072/964c1043e0051d9555e151bafaed6bbec7bd4742.gifv">
  </a>

  <a href="em-disputa.html" class="portal em-disputa">
    <img src="https://64.media.tumblr.com/1dc4cd7e29014f3716abe161582e52e5/3fb385402c9c4596-73/s540x810/19e8b8e531a9dfed30e8da235e89a1c7b8e874cb.gifv">
    <span class="portal-label">Em Disputa</span>
  </a>

</main>

<script src="/blog/footer.js"></script>
<script src="/blog/i18n.js"></script>

</body>
</html>
